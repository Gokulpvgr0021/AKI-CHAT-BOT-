<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnum Clothing SKL - Daily Attendance</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #1e293b; 
            --accent: #d4af37; 
            --bg-color: #f8fafc;
            --surface: #ffffff;
            --text-main: #334155;
            --text-light: #94a3b8;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            background-color: var(--surface);
            width: 100%;
            max-width: 1050px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        #print-area { background-color: var(--surface); }

        .header {
            background-color: var(--primary);
            color: white;
            padding: 30px;
            text-align: center;
            border-bottom: 4px solid var(--accent);
        }

        .header h1 {
            font-weight: 600;
            font-size: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header p {
            font-weight: 300;
            font-size: 14px;
            color: #cbd5e1;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        .date-container {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .date-container input[type="date"] {
            padding: 5px 10px;
            border: 1px solid var(--accent);
            border-radius: 4px;
            background-color: rgba(255,255,255,0.1);
            color: white;
            font-family: 'Poppins', sans-serif;
            outline: none;
            color-scheme: dark;
        }

        .content { padding: 30px; }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-bottom: 20px;
        }

        th { 
            text-align: left; 
            padding: 15px 10px; 
            font-weight: 600;
            color: var(--text-light);
            border-bottom: 2px solid var(--border);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        td { 
            padding: 10px; 
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        input[type="text"], input[type="time"] { 
            width: 100%;
            padding: 10px; 
            border: 1px solid transparent;
            border-radius: 6px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.3s ease;
            background: transparent;
        }

        input[type="text"]:focus, input[type="time"]:focus, input[type="text"]:hover, input[type="time"]:hover {
            border-color: var(--border);
            background: #f8fafc;
        }

        .total-hours {
            font-weight: 600;
            color: var(--primary);
            font-size: 15px;
            text-align: center;
        }

        /* Status Badge Styling */
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            text-align: center;
            min-width: 85px;
        }

        .absent { background-color: #fee2e2; color: #dc2626; }
        .present { background-color: #dcfce7; color: #16a34a; }

        .action-buttons {
            display: flex;
            gap: 15px;
            padding: 0 30px 30px 30px;
        }

        button {
            border: none;
            padding: 12px 24px; 
            border-radius: 6px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer; 
            transition: background-color 0.3s ease, transform 0.1s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
        }

        .btn-add { 
            background-color: #f1f5f9;
            color: var(--primary);
            border: 1px solid var(--border);
        }
        .btn-add:hover { background-color: #e2e8f0; }

        .btn-download {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-download:hover { background-color: #0f172a; }
        button:active { transform: scale(0.98); }

    </style>
</head>
<body>

    <div class="container">
        <div id="print-area">
            <div class="header">
                <h1>Magnum Clothing SKL Warehouse</h1>
                <p>Fabric Team • Daily Attendance & Hours</p>
                <div class="date-container">
                    <input type="date" id="attendanceDate">
                </div>
            </div>
            
            <div class="content">
                <table id="attendanceTable">
                    <thead>
                        <tr>
                            <th style="width: 25%;">Staff Member</th>
                            <th style="width: 20%;">In-Time</th>
                            <th style="width: 20%;">Out-Time</th>
                            <th style="text-align: center; width: 15%;">Hours</th>
                            <th style="text-align: center; width: 20%;">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows are injected by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="action-buttons" id="action-buttons">
            <button class="btn-add" onclick="addBlankRow()">
                <span>+</span> Add Extra Row
            </button>
            <button class="btn-download" onclick="generatePDF()">
                Download as PDF
            </button>
        </div>
    </div>

    <script>
        // Set today's date automatically
        document.getElementById('attendanceDate').valueAsDate = new Date();

        // Editable list of your staff - change these names as needed
        const staffList = [
            "Gokul P",
            "Staff Member 2",
            "Staff Member 3",
            "Staff Member 4",
            "Staff Member 5"
        ];

        // Initialize table on load
        window.onload = function() {
            const tbody = document.querySelector("#attendanceTable tbody");
            staffList.forEach(name => createRow(tbody, name));
        };

        function createRow(tbody, name = "") {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><input type="text" value="${name}" placeholder="Enter name..."></td>
                <td><input type="time" class="in-time" onchange="updateRow(this)"></td>
                <td><input type="time" class="out-time" onchange="updateRow(this)"></td>
                <td class="total-hours">0.00 hrs</td>
                <td style="text-align: center;"><span class="status-badge absent">Absent</span></td>
            `;
            tbody.appendChild(tr);
        }

        function addBlankRow() {
            const tbody = document.querySelector("#attendanceTable tbody");
            createRow(tbody, "");
        }

        function updateRow(element) {
            let row = element.closest('tr');
            let inTime = row.querySelector('.in-time').value;
            let outTime = row.querySelector('.out-time').value;
            let statusBadge = row.querySelector('.status-badge');
            let totalCell = row.querySelector('.total-hours');
            
            // Auto-mark Present/Absent
            if (inTime || outTime) {
                statusBadge.innerText = "Present";
                statusBadge.className = "status-badge present";
            } else {
                statusBadge.innerText = "Absent";
                statusBadge.className = "status-badge absent";
                totalCell.innerText = "0.00 hrs";
                totalCell.style.color = "var(--primary)";
                return; // Stop here if both are empty
            }

            // Calculate hours if both times are filled
            if (inTime && outTime) {
                let inDate = new Date("01/01/2000 " + inTime);
                let outDate = new Date("01/01/2000 " + outTime);
                
                if (outDate < inDate) {
                    outDate.setDate(outDate.getDate() + 1); 
                }
                
                let diff = (outDate - inDate) / 1000 / 60 / 60; 
                totalCell.innerText = diff.toFixed(2) + " hrs";
                totalCell.style.color = "#d4af37"; 
            } else {
                totalCell.innerText = "0.00 hrs";
                totalCell.style.color = "var(--primary)";
            }
        }

        function generatePDF() {
            const element = document.getElementById('print-area');
            const dateValue = document.getElementById('attendanceDate').value;
            
            const opt = {
                margin:       [0, 0, 0, 0],
                filename:     `Magnum_Fabric_Attendance_${dateValue}.pdf`,
                image:        { type: 'jpeg', quality: 1.0 },
                html2canvas:  { 
                    scale: 2, 
                    useCORS: true,
                    onclone: function (clonedDoc) {
                        // Hardcode input values so they appear correctly in PDF
                        let inputs = clonedDoc.querySelectorAll('input');
                        inputs.forEach(input => {
                            if (input.type === 'text' || input.type === 'time' || input.type === 'date') {
                                input.setAttribute('value', input.value);
                            }
                        });
                    }
                },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }
    </script>

</body>
</html>
