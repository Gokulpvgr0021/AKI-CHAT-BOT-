<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Attendance Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        input[type="text"], input[type="time"] { padding: 5px; width: 90%; }
        button { padding: 10px 15px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Daily Staff Attendance</h2>
    
    <table id="attendanceTable">
        <thead>
            <tr>
                <th>Staff Name</th>
                <th>In-Time</th>
                <th>Out-Time</th>
                <th>Total Hours</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="text" placeholder="Enter Name"></td>
                <td><input type="time" class="in-time" onchange="calculateHours(this)"></td>
                <td><input type="time" class="out-time" onchange="calculateHours(this)"></td>
                <td class="total-hours">0.00 hrs</td>
            </tr>
        </tbody>
    </table>

    <button onclick="addRow()">+ Add Staff Member</button>

    <script>
        function calculateHours(element) {
            let row = element.closest('tr');
            let inTime = row.querySelector('.in-time').value;
            let outTime = row.querySelector('.out-time').value;
            
            if (inTime && outTime) {
                let inDate = new Date("01/01/2000 " + inTime);
                let outDate = new Date("01/01/2000 " + outTime);
                
                // Account for overnight shifts past midnight
                if (outDate < inDate) {
                    outDate.setDate(outDate.getDate() + 1); 
                }
                
                let diff = (outDate - inDate) / 1000 / 60 / 60; // convert milliseconds to hours
                row.querySelector('.total-hours').innerText = diff.toFixed(2) + " hrs";
            }
        }

        function addRow() {
            let table = document.getElementById("attendanceTable").getElementsByTagName('tbody')[0];
            let newRow = table.rows[0].cloneNode(true);
            
            // Clear the inputs in the cloned row
            let inputs = newRow.querySelectorAll('input');
            inputs.forEach(input => input.value = '');
            newRow.querySelector('.total-hours').innerText = '0.00 hrs';
            
            table.appendChild(newRow);
        }
    </script>

</body>
</html>
